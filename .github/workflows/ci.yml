name: CI (Pure-Rust Crate)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Build, Clippy & Test (pymupdf4llm-rs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets --features "async,cli,images" -- -D warnings

      - name: Run unit & compatibility tests
        run: cargo test --features "async,cli,images"

      - name: Check feature combinations
        run: |
          cargo check --no-default-features
          cargo check --no-default-features --features async
          cargo check --features "async,cli,images"

  python-pyo3:
    name: Build & Test Python Package (PyO3 + maturin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin and pytest
        run: pip install --upgrade pip maturin pytest

      - name: Build extension wheel & run pytest
        run: |
          maturin build --release --out dist --find-interpreter
          pip install --force-reinstall dist/*.whl
          pytest -v tests/test_python_api.py
