[package]
name = "pymupdf4llm-rs"
version = "0.4.2"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0 OR MIT"
readme = "README.md"
description = "100% pure-Rust implementation of pymupdf4llm for LLM/RAG PDF-to-Markdown extraction with Tokio + Rayon high-concurrency async support."
keywords = ["pdf", "markdown", "llm", "rag", "pymupdf4llm"]
categories = ["parsing", "text-processing", "asynchronous"]
repository = "https://github.com/0passion0/pymupdf4llm-rs"
homepage = "https://github.com/0passion0/pymupdf4llm-rs"
exclude = [
    "node_modules/",
    "dist/",
    "web/",
    "public/",
    "server.ts",
    "package.json",
    "bun.lock*",
    "tsconfig.json",
    "vite.config.ts",
    "index.html",
    "metadata.json",
    ".playwright-cli/",
    ".aistudio/",
]

[lib]
name = "pymupdf4llm_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["async", "cli", "images"]
async = ["dep:tokio", "dep:futures"]
cli = ["dep:clap", "async"]
images = ["dep:image"]
python = ["dep:pyo3", "async"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22"
dashmap = "6.1"
parking_lot = "0.12"
unicode-normalization = "0.1"
regex = "1.11"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "fs", "io-util", "macros"], optional = true }
futures = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
pyo3 = { version = "0.23", features = ["abi3-py39"], optional = true }

[[bin]]
name = "pymupdf4llm"
path = "src/bin/pymupdf4llm.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
