[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pymupdf4llm-rs"
version = "0.4.0"
description = "100% pure-Rust pymupdf4llm PDF-to-Markdown library for Python with reusable engine resources, bounded concurrency, and CJK/table extraction."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0 OR MIT" }
keywords = ["pdf", "markdown", "llm", "rag", "pymupdf4llm", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "pymupdf4llm_rs._native"
strip = true
