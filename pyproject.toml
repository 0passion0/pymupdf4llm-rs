[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pymupdf4llm-rs"
version = "0.4.1"
description = "100% pure-Rust pymupdf4llm PDF-to-Markdown library for Python with reusable engine resources, bounded concurrency, and CJK/table extraction."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0 OR MIT" }
keywords = ["pdf", "markdown", "llm", "rag", "pymupdf4llm", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/0passion0/pymupdf4llm-rs"
Repository = "https://github.com/0passion0/pymupdf4llm-rs"
Issues = "https://github.com/0passion0/pymupdf4llm-rs/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.maturin]
no-default-features = true
features = ["extension-module"]
python-source = "python"
module-name = "pymupdf4llm_rs._native"
strip = true
exclude = [
    "node_modules/**",
    "dist/**",
    "web/**",
    "public/**",
    "server.ts",
    "package.json",
    "bun.lock*",
    "tsconfig.json",
    "vite.config.ts",
    "index.html",
    "metadata.json",
    ".playwright-cli/**",
    ".aistudio/**",
]
